<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><head><link rel="stylesheet" href="./css/main.css"></head><header><p><img src="media/header.jpg"></p><p><a href="index.html">Início</a></p></header><main><h2>Analise</h2><figure class="box"><figcaption class="side"><span style="font-weight: 700">TEOREMA 1</span><br><em>o limite de uma função via o limite de uma sequência</em></figcaption><p>Sejam <math><mi>𝑓</mi><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mi>𝑋</mi><mo>⊂</mo><mi>ℝ</mi><mo stretchy="false">→</mo><mi>ℝ</mi></math>, <math><mi>𝑎</mi><mo>∈</mo><msup><mi>𝑋</mi><mo>′</mo></msup></math> e <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub></math> uma sequência em <math><mi>𝑋</mi></math> tal que <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>≠</mo><mi>𝑎</mi></math> e <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>=</mo><mi>𝑎</mi></math>. Então</p><math display="block"><munder><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mrow><mi>𝑥</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝑎</mi></mrow></munder><mi>𝑓</mi><mo>=</mo><mi>𝐿</mi><mspace width="0.2222em"/><mtext> se e somente se </mtext><mo form="prefix" lspace="0.16666666666666666em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>=</mo><mi>𝐿</mi><mi>.</mi></math></figure><figure><figcaption class="side"><span style="font-weight: 700">PROVA</span><br><em></em></figcaption><p><strong>PARTE 1:</strong> primeiro vamos provar que</p><math display="block"><munder><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mrow><mi>𝑥</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝑎</mi></mrow></munder><mi>𝑓</mi><mo>=</mo><mi>𝐿</mi><mspace width="0.2222em"/><mtext> implica </mtext><mo form="prefix" lspace="0.16666666666666666em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>=</mo><mi>𝐿</mi><mi>.</mi></math><p>Sendo <math><msub><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mrow><mi>𝑥</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝑎</mi></mrow></msub><mi>𝑓</mi><mo>=</mo><mi>𝐿</mi></math>, dado <math><mi>𝜀</mi><mo>></mo><mn>0</mn></math> existe um <math><mi>𝛿</mi></math> tal que</p><math display="block"><mn>0</mn><mo>&lt;</mo><mo lspace="0em" rspace="0em">|</mo><mi>𝑥</mi><mo>−</mo><mi>𝑎</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝛿</mi><mspace width="0.2222em"/><mtext>com</mtext><mspace width="0.2222em"/><mi>𝑥</mi><mo>∈</mo><mi>𝑋</mi><mo stretchy="false">⇒</mo><mo lspace="0em" rspace="0em">|</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>−</mo><mi>𝐿</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝜀</mi><mi>.</mi></math><p>Mas, sendo <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>=</mo><mi>𝑎</mi></math>, dado <math><mi>𝛿</mi></math> existe <math><msub><mi>𝑛</mi><mn>0</mn></msub></math> tal que</p><math display="block"><mi>𝑛</mi><mo>></mo><msub><mi>𝑛</mi><mn>0</mn></msub><mo stretchy="false">⇒</mo><mn>0</mn><mo>&lt;</mo><mo lspace="0em" rspace="0em">|</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>−</mo><mi>𝑎</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝛿</mi><mi>.</mi></math><p>Daí, temos que dado <math><mi>𝜀</mi><mo>></mo><mn>0</mn></math> existe <math><msub><mi>𝑛</mi><mn>0</mn></msub></math> tal que</p><math display="block"><mi>𝑛</mi><mo>></mo><msub><mi>𝑛</mi><mn>0</mn></msub><mo stretchy="false">⇒</mo><mo lspace="0em" rspace="0em">|</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>−</mo><mi>𝑎</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝛿</mi><mo stretchy="false">⇒</mo><mo lspace="0em" rspace="0em">|</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>−</mo><mi>𝐿</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝜀</mi></math><p>donde <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>=</mo><mi>𝐿</mi></math>.</p><p><strong>PARTE 2:</strong> agora vamos provar que</p><math display="block"><munder><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mrow><mi>𝑥</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝑎</mi></mrow></munder><mi>𝑓</mi><mspace width="0.2222em"/><mtext> implica </mtext><mspace width="0.2222em"/><mi>𝐿</mi><mo stretchy="false">⇒</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>≠</mo><mi>𝐿</mi></math><p>De fato, sendo <math><msub><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mrow><mi>𝑥</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝑎</mi></mrow></msub><mi>𝑓</mi><mo>≠</mo><mi>𝐿</mi></math>, existe <math><mi>𝜀</mi></math> tal que para todo <math><mi>𝛿</mi></math>, mesmo que se tenha <math><mn>0</mn><mo>&lt;</mo><mo lspace="0em" rspace="0em">|</mo><mi>𝑥</mi><mo>−</mo><mi>𝑎</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝛿</mi></math> não se tem <math><mo stretchy="false">|</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>−</mo><mi>𝐿</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝜀</mi></math>. Daí, pondo <math><mi>𝛿</mi><mo>=</mo><mfrac><mn>1</mn><mi>𝑛</mi></mfrac></math> por exemplo, podemos encontrar <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub></math> tal que <math><mo stretchy="false">|</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>−</mo><mi>𝑎</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝛿</mi></math> para todo <math><mi>𝑛</mi><mo>></mo><msub><mi>𝑛</mi><mn>0</mn></msub></math>, mas sem que tenhamos <math><mo stretchy="false">|</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>−</mo><mi>𝐿</mi><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mi>𝜀</mi></math>, donde <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>≠</mo><mi>𝐿</mi></math> <math><mi>∎</mi></math></p><div style="position: absolute; bottom: 0; right: 0">∎</div></figure><figure class="box"><figcaption class="side"><span style="font-weight: 700">TEOREMA 2</span><br><em>do valor intermediário</em></figcaption>Seja <math><mi>𝑓</mi><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mrow><mo>[</mo><mrow><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi></mrow><mo>]</mo></mrow><mo stretchy="false">→</mo><mi>ℝ</mi></math> contínua e seja <math><mi>𝑑</mi><mo>∈</mo><mi>ℝ</mi></math> tal que <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑎</mi><mo>)</mo></mrow><mo>&lt;</mo><mi>𝑑</mi><mo>&lt;</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑏</mi><mo>)</mo></mrow></math>. Então existe <math><mi>𝑐</mi><mo>∈</mo><mrow><mo>(</mo><mrow><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi></mrow><mo>)</mo></mrow></math> tal que <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑐</mi><mo>)</mo></mrow><mo>=</mo><mi>𝑑</mi></math>.</figure><figure><figcaption class="side"><span style="font-weight: 700">PROVA</span><br><em></em></figcaption><p>Seja <math><mi>𝐴</mi><mo>=</mo><mrow><mo>{</mo><mrow><mi>𝑥</mi><mo>∈</mo><mrow><mo>[</mo><mrow><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi></mrow><mo>]</mo></mrow><mspace width="0.2222em"/><mo lspace="0em" rspace="0em">|</mo><mspace width="0.2222em"/><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>&lt;</mo><mi>𝑑</mi></mrow><mo>}</mo></mrow></math>. Vemos que <math><mi>𝐴</mi><mo>≠</mo><mi>⌀</mi></math>, já que <math><mi>𝑎</mi><mo>∈</mo><mrow><mo>[</mo><mrow><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi></mrow><mo>]</mo></mrow></math> e <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑎</mi><mo>)</mo></mrow><mo>&lt;</mo><mi>𝑑</mi></math>, donde pelo menos <math><mi>𝑎</mi><mo>∈</mo><mi>𝐴</mi></math>. Mostraremos que <math><mi>𝐴</mi></math> não tem elemento máximo.</p><p>Com efeito, seja <math><mi>𝛼</mi><mo>∈</mo><mi>𝐴</mi></math>. Como <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝛼</mi><mo>)</mo></mrow><mo>&lt;</mo><mi>𝑑</mi></math>, segue-se que <math><mi>𝛼</mi><mo>≠</mo><mi>𝑏</mi></math>, e sendo <math><mi>𝛼</mi><mo>∈</mo><mrow><mo>[</mo><mrow><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi></mrow><mo>]</mo></mrow></math>, concluímos que <math><mi>𝛼</mi><mo>&lt;</mo><mi>𝑏</mi></math>. Tomando <math><mi>𝜀</mi><mo>=</mo><mi>𝑑</mi><mo>−</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝛼</mi><mo>)</mo></mrow></math>, pela continuidade de <math><mi>𝑓</mi></math> em <math><mi>𝛼</mi></math>, existe <math><mi>𝛿</mi><mo>></mo><mn>0</mn></math> tal que</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><mi>𝑥</mi><mo>∈</mo><mrow><mo>[</mo><mrow><mi>𝛼</mi><mo>,</mo><mi>𝛼</mi><mo>+</mo><mi>𝛿</mi></mrow><mo>)</mo></mrow></mtd><mtd><mo form="infix" stretchy="false">⇒</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝛼</mi><mo>)</mo></mrow><mo>−</mo><mi>𝜀</mi><mo>&lt;</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>&lt;</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝛼</mi><mo>)</mo></mrow><mo>+</mo><mi>𝜀</mi></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix" stretchy="false">⇒</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>&lt;</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝛼</mi><mo>)</mo></mrow><mo>+</mo><mi>𝜀</mi><mo>=</mo><mi>𝑑</mi><mi>.</mi></mtd></mtr></mtable></math><p>Tomando <math><mi>𝛿</mi></math> pequeno o suficiente de modo que se tenha <math><mi>𝛼</mi><mo>+</mo><mi>𝛿</mi><mo>&lt;</mo><mi>𝑏</mi></math> temos que se <math><mi>𝑥</mi><mo>∈</mo><mrow><mo>[</mo><mrow><mi>𝛼</mi><mo>,</mo><mi>𝛼</mi><mo>+</mo><mi>𝛿</mi></mrow><mo>)</mo></mrow></math> então</p><math display="block"><mi>𝑥</mi><mo>≥</mo><mi>𝛼</mi><mspace width="0.2222em"/><mtext> e </mtext><mspace width="0.2222em"/><mi>𝑥</mi><mo>&lt;</mo><mi>𝛼</mi><mo>+</mo><mi>𝛿</mi><mo>&lt;</mo><mi>𝑏</mi><mi>.</mi></math><p>Daí, todo ponto de <math><mrow><mo>[</mo><mrow><mi>𝛼</mi><mo>,</mo><mi>𝛼</mi><mo>+</mo><mi>𝛿</mi></mrow><mo>)</mo></mrow></math> pertence a <math><mrow><mo>[</mo><mrow><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi></mrow><mo>]</mo></mrow></math> e é menor do que <math><mi>𝑑</mi></math>, donde <math><mrow><mo>[</mo><mrow><mi>𝛼</mi><mo>,</mo><mi>𝛼</mi><mo>+</mo><mi>𝛿</mi></mrow><mo>)</mo></mrow><mo>⊂</mo><mi>𝐴</mi></math>, qualquer que seja <math><mi>𝛼</mi></math>. Segue-se então que <math><mi>𝐴</mi></math> não tem elemento máximo.</p><p>Seja <math><mi>𝑐</mi><mo>=</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">sup</mo><mi>𝐴</mi></math>. Então existe uma sequência <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub></math> de elementos em <math><mi>𝐴</mi></math> com <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>=</mo><mi>𝑐</mi></math>. Sendo <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>∈</mo><mi>𝐴</mi></math>, temos que <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>&lt;</mo><mi>𝑑</mi></math> donde</p><math display="block"><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>=</mo><mi>𝑐</mi><mo>≤</mo><mi>𝑑</mi><mi>.</mi></math><p>Mas como <math><mi>𝐴</mi></math> não tem maior elemento, <math><mo lspace="0em" rspace="0.16666666666666666em">sup</mo><mi>𝐴</mi><mo>=</mo><mi>𝑐</mi><mo>∉</mo><mi>𝐴</mi></math>. Daí, temos que <math><mi>𝑐</mi></math> não é menor do que <math><mi>𝑑</mi></math>, porque se fosse, pertenceria a <math><mi>𝐴</mi></math>. Daí, concluímos que donde <math><mi>𝑐</mi><mo>≥</mo><mi>𝑑</mi></math>. Mas como <math><mi>𝑐</mi><mo>≤</mo><mi>𝑑</mi></math>, temos que <math><mi>𝑐</mi><mo>=</mo><mi>𝑑</mi></math> <math><mi>∎</mi></math></p><div style="position: absolute; bottom: 0; right: 0">∎</div></figure><figure id="t3" class="box"><figcaption class="side"><span style="font-weight: 700">TEOREMA 3</span><br><em></em></figcaption>Seja <math><mi>𝑋</mi><mo>⊂</mo><mi>ℝ</mi></math> compacto. Então se <math><mi>𝑓</mi><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mi>𝑋</mi><mo stretchy="false">→</mo><mi>ℝ</mi></math> é contínua, <math><mi>𝑌</mi><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math> também é compacto.</figure><figure><figcaption class="side"><span style="font-weight: 700">PROVA</span><br><em></em></figcaption><p>Seja <math><msub><mi>𝑦</mi><mi>𝑛</mi></msub></math> uma sequência em <math><mi>𝑌</mi></math>. Então, para cada <math><mi>𝑛</mi></math> podemos encontrar <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>∈</mo><mi>𝑋</mi></math> tal que <math><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>=</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub></math>. Sendo <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>∈</mo><mi>𝑋</mi></math> e <math><mi>𝑋</mi></math> compacto, existe uma subsequência <math><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub></math> de <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub></math> que é converge para <math><mi>𝑥</mi><mo>∈</mo><mi>𝑋</mi></math>. Sendo <math><mi>𝑓</mi></math> contínua, temos que</p><math display="block"><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>)</mo></mrow><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>∈</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow><mi>.</mi></math><p>Daí, dada uma sequência <math><msub><mi>𝑦</mi><mi>𝑛</mi></msub></math> de termos em <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math>, é possível encontrar uma subsequência</p><math display="block"><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>)</mo></mrow></math><p>que converge para <math><mi>𝑦</mi><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>∈</mo><mi>𝑌</mi></math>. Daí, <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math> é compacto <math><mi>∎</mi></math></p><div style="position: absolute; bottom: 0; right: 0">∎</div></figure><figure><figcaption class="side"><span style="font-weight: 700">COROLÁRIO</span><br><em>teorema de Weierstrass</em></figcaption><p>Seja <math><mi>𝑓</mi><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mi>𝑋</mi><mo>⊂</mo><mi>ℝ</mi><mo stretchy="false">→</mo><mi>ℝ</mi></math> contínua com <math><mi>𝑋</mi></math> compacto. Então <math><mi>𝑓</mi></math> atinge seus extremos em <math><mi>𝑋</mi></math>, isto é, existem <math><msub><mi>𝑥</mi><mtext>min</mtext></msub><mo>,</mo><msub><mi>𝑥</mi><mtext>max</mtext></msub><mo>∈</mo><mi>𝑋</mi></math> tais que</p><math display="block"><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mtext>min</mtext></msub><mo>)</mo></mrow><mo>≤</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>≤</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mtext>max</mtext></msub><mo>)</mo></mrow></math><p>para todo <math><mi>𝑥</mi><mo>∈</mo><mi>𝑋</mi></math>.</p></figure><figure><figcaption class="side"><span style="font-weight: 700">PROVA</span><br><em></em></figcaption><p>Pelo <a href="#t3">teorema 3</a>, <math><mi>𝑌</mi></math> é compacto, e portanto é limitado e fechado. Daí, existem <math><mo lspace="0em" rspace="0.16666666666666666em">sup</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math> e <math><mo lspace="0em" rspace="0.16666666666666666em">inf</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math>, e ambos pertencem a <math><mi>𝑌</mi></math>. Então, sendo <math><mi>𝑌</mi><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math>, existem <math><msub><mi>𝑥</mi><mtext>min</mtext></msub><mo>,</mo><msub><mi>𝑥</mi><mtext>max</mtext></msub><mo>∈</mo><mi>𝑋</mi></math> tais que <math><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mtext>min</mtext></msub><mo>)</mo></mrow><mo>=</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">inf</mo><mi>𝑌</mi></math> e <math><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mtext>max</mtext></msub><mo>)</mo></mrow><mo>=</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">sup</mo><mi>𝑌</mi></math>. Como dado <math><mi>𝑦</mi><mo>∈</mo><mi>𝑌</mi></math>, temos que</p><math display="block"><mo lspace="0em" rspace="0.16666666666666666em">inf</mo><mi>𝑌</mi><mo>≤</mo><mi>𝑦</mi><mo>≤</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">sup</mo><mi>𝑌</mi></math><p>temos que</p><math display="block"><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mtext>min</mtext></msub><mo>)</mo></mrow><mo>≤</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>≤</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mtext>max</mtext></msub><mo>)</mo></mrow></math><p>para todo <math><mi>𝑥</mi><mo>∈</mo><mi>𝑋</mi></math> <math><mi>∎</mi></math></p><div style="position: absolute; bottom: 0; right: 0">∎</div></figure><figure class="box"><figcaption class="side"><span style="font-weight: 700">TEOREMA 4</span><br><em></em></figcaption>Seja <math><mi>𝑓</mi><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mi>𝑋</mi><mo>⊂</mo><mi>ℝ</mi><mo stretchy="false">→</mo><mi>ℝ</mi></math> e <math><mi>𝐼</mi><mo>⊂</mo><mi>𝑋</mi></math> um intervalo. Então <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝐼</mi><mo>)</mo></mrow></math> também é um intervalo.</figure><figure><figcaption class="side"><span style="font-weight: 700">PROVA</span><br><em></em></figcaption><p>Suponhamos primeiro que <math><mi>𝑓</mi></math> seja limitada em <math><mi>𝐼</mi></math>. Sendo assim, existem <math><mi>𝛼</mi><mo>=</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">inf</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝐼</mi><mo>)</mo></mrow></math> e <math><mi>𝛽</mi><mo>=</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">sup</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝐼</mi><mo>)</mo></mrow></math>. Mostraremos que se <math><mi>𝛼</mi><mo>&lt;</mo><mi>𝑦</mi><mo>&lt;</mo><mi>𝛽</mi></math> então <math><mi>𝑦</mi><mo>∈</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝐼</mi><mo>)</mo></mrow></math>, ou seja, existe <math><mi>𝑥</mi><mo>∈</mo><mi>𝐼</mi></math> tal que <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>=</mo><mi>𝑦</mi></math>. De fato, pela definição de <math><mo form="prefix" lspace="0em" rspace="0em">inf</mo></math> e <math><mo form="prefix" lspace="0em" rspace="0em">sup</mo></math>, existem <math><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi><mo>∈</mo><mi>𝐼</mi></math> tais que</p><math display="block"><mi>𝛼</mi><mo>≤</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑎</mi><mo>)</mo></mrow><mo>&lt;</mo><mi>𝑦</mi><mo>&lt;</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑏</mi><mo>)</mo></mrow><mo>≤</mo><mi>𝛽</mi><mi>.</mi></math><p>Daí, pelo teorema do valor intermediário, existe <math><mi>𝑥</mi><mo>∈</mo><mrow><mo>[</mo><mrow><mi>𝑎</mi><mo>,</mo><mi>𝑏</mi></mrow><mo>]</mo></mrow><mo>⊂</mo><mi>𝐼</mi></math> tal que <math><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow><mo>=</mo><mi>𝑦</mi></math>.</p><p>Agora se <math><mi>𝑓</mi></math> não for limitada em <math><mi>𝐼</mi></math>, então <math><mo lspace="0em" rspace="0.16666666666666666em">inf</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝐼</mi><mo>)</mo></mrow><mo>=</mo><mo form="prefix">−</mo><mi>∞</mi></math> ou <math><mo lspace="0em" rspace="0.16666666666666666em">sup</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝐼</mi><mo>)</mo></mrow><mo>=</mo><mo form="prefix">+</mo><mi>∞</mi></math>, ou ambos. Ainda assim, vale o argumento acima, considerando um intervalo ilimitado <math><mi>∎</mi></math></p><div style="position: absolute; bottom: 0; right: 0">∎</div></figure><figure class="box"><figcaption class="side"><span style="font-weight: 700">TEOREMA 5</span><br><em></em></figcaption>Seja <math><mi>𝑓</mi><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mi>𝑋</mi><mo>⊂</mo><mi>ℝ</mi><mo stretchy="false">→</mo><mi>ℝ</mi></math> contínua e injetiva com <math><mi>𝑋</mi></math> compacto. Então <math><mi>𝑌</mi><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math> é compacto e <math><msup><mi>𝑓</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mi>𝑌</mi><mo stretchy="false">→</mo><mi>ℝ</mi></math> é contínua.</figure><figure><figcaption class="side"><span style="font-weight: 700">PROVA</span><br><em>por contradição</em></figcaption><p>Pelo <a href="#t3">teorema 3</a>, temos que <math><mi>𝑌</mi><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑋</mi><mo>)</mo></mrow></math> é compacto, uma vez que <math><mi>𝑓</mi></math> é contínua e <math><mi>𝑋</mi></math> é compacto.</p><p>Para mostrar que <math><mi>𝑔</mi></math> é contínua em <math><mi>𝑌</mi></math>, vamos mostrar que dado <math><mi>𝑏</mi><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑎</mi><mo>)</mo></mrow><mo>∈</mo><mi>𝑌</mi></math>, <math><mi>𝑔</mi></math> é contínua em <math><mi>𝑏</mi></math>. Com efeito, se não fosse assim, existiria uma sequência <math><msub><mi>𝑦</mi><mi>𝑛</mi></msub></math> em <math><mi>𝑌</mi></math> tal que <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo>=</mo><mi>𝑏</mi></math> mas <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑔</mi><mrow><mo>(</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>≠</mo><mi>𝑔</mi><mrow><mo>(</mo><mi>𝑏</mi><mo>)</mo></mrow></math>, ou seja, existe <math><mi>𝜀</mi><mo>></mo><mn>0</mn></math> tal que <math><mo stretchy="false">|</mo><mi>𝑔</mi><mrow><mo>(</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>−</mo><mi>𝑔</mi><mrow><mo>(</mo><mi>𝑏</mi><mo>)</mo></mrow><mo lspace="0em" rspace="0em">|</mo><mo>≥</mo><mi>𝜀</mi></math> para todo <math><mi>𝑛</mi></math>.</p><p>Seja <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>=</mo><mi>𝑔</mi><mrow><mo>(</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo>)</mo></mrow></math>. Daí, como <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>∈</mo><mi>𝑋</mi></math> e <math><mi>𝑋</mi></math> é compacto, existe uma subsequência <math><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub></math> de <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub></math> com <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>=</mo><msup><mi>𝑎</mi><mo>′</mo></msup></math>. A essa subsequência corresponde uma subsequência <math><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub></math> de <math><msub><mi>𝑦</mi><mi>𝑛</mi></msub></math> com <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>=</mo><mi>𝑏</mi></math>. Daí, temos que</p><math display="block"><mrow><mo>|</mo><mrow><mi>𝑔</mi><mrow><mo>(</mo><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>)</mo></mrow><mo>−</mo><mi>𝑔</mi><mrow><mo>(</mo><mi>𝑏</mi><mo>)</mo></mrow></mrow><mo>|</mo></mrow><mo>=</mo><mo lspace="0em" rspace="0em">|</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>−</mo><mi>𝑎</mi><mo lspace="0em" rspace="0em">|</mo><mo>≥</mo><mi>𝜀</mi></math><p>donde <math><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>≥</mo><mi>𝑎</mi><mo>+</mo><mi>𝜀</mi></math>. Daí, <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>=</mo><msup><mi>𝑎</mi><mo>′</mo></msup><mo>≥</mo><mi>𝑎</mi><mo>+</mo><mi>𝜀</mi></math>, e em particular <math><msup><mi>𝑎</mi><mo>′</mo></msup><mo>≠</mo><mi>𝑎</mi></math>. Mas sendo <math><mi>𝑓</mi></math> contínua em <math><msup><mi>𝑎</mi><mo>′</mo></msup></math>, temos que</p><math display="block"><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>)</mo></mrow><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><msup><mi>𝑎</mi><mo>′</mo></msup><mo>)</mo></mrow><mi>.</mi></math><p>Mas como</p><math display="block"><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>)</mo></mrow><mo>=</mo><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mspace width="0.2222em"/><mtext> e </mtext><mo form="prefix" lspace="0.16666666666666666em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>=</mo><mi>𝑏</mi></math><p>temos que <math><mi>𝑓</mi><mrow><mo>(</mo><msup><mi>𝑎</mi><mo>′</mo></msup><mo>)</mo></mrow><mo>=</mo><mi>𝑏</mi><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑎</mi><mo>)</mo></mrow></math>, em contradição com a injetividade de <math><mi>𝑓</mi></math>. Daí, deve ser que <math><mi>𝑔</mi></math> é contínua <math><mi>∎</mi></math></p><div style="position: absolute; bottom: 0; right: 0">∎</div></figure><figure class="box"><figcaption class="side"><span style="font-weight: 700">TEOREMA 6</span><br><em></em></figcaption>Seja <math><mi>𝑋</mi><mo>⊂</mo><mi>ℝ</mi></math> compacto. Então se <math><mi>𝑓</mi><mo lspace="0.2777777777777778em" rspace="0.2777777777777778em">:</mo><mi>𝑋</mi><mo stretchy="false">→</mo><mi>ℝ</mi></math> é contínua, <math><mi>𝑓</mi></math> também é uniformemente contínua.</figure><figure><figcaption class="side"><span style="font-weight: 700">PROVA</span><br><em>por absurdo</em></figcaption><p>Suponhamos que <math><mi>𝑓</mi></math> não seja uniformemente contínua. Daí, existiriam <math><mi>𝜀</mi><mo>></mo><mn>0</mn></math> e sequências <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub></math> e <math><msub><mi>𝑦</mi><mi>𝑛</mi></msub></math> tais que</p><math display="block"><mo stretchy="false">|</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>−</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mfrac><mn>1</mn><mi>𝑛</mi></mfrac><mspace width="0.2222em"/><mtext> mas ainda assim </mtext><mspace width="0.2222em"/><mo lspace="0em" rspace="0em">|</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>−</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo lspace="0em" rspace="0em">|</mo><mo>≥</mo><mi>𝜀</mi><mi>.</mi></math><p>Sendo <math><mi>𝑋</mi></math> compacto e <math><msub><mi>𝑥</mi><mi>𝑛</mi></msub></math> uma sequência em <math><mi>𝑋</mi></math>, existe uma subsequência <math><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub></math> que converge para algum número <math><mi>𝑥</mi><mo>∈</mo><mi>𝑋</mi></math>. Sendo <math><mo stretchy="false">|</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>−</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo lspace="0em" rspace="0em">|</mo><mo>&lt;</mo><mfrac><mn>1</mn><mi>𝑛</mi></mfrac></math>, existe também uma subsequência <math><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub></math> com <math><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>=</mo><mi>𝑥</mi></math>. Mas como <math><mi>𝑓</mi></math> é contínua</p><math display="block"><mo lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>)</mo></mrow><mo>=</mo><mo form="prefix" lspace="0em" rspace="0.16666666666666666em">lim</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑦</mi><msub><mi>𝑛</mi><mi>𝑘</mi></msub></msub><mo>)</mo></mrow><mo>=</mo><mi>𝑓</mi><mrow><mo>(</mo><mi>𝑥</mi><mo>)</mo></mrow></math><p>em contradição com a desigualdade</p><math display="block"><mo stretchy="false">|</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑥</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo>−</mo><mi>𝑓</mi><mrow><mo>(</mo><msub><mi>𝑦</mi><mi>𝑛</mi></msub><mo>)</mo></mrow><mo lspace="0em" rspace="0em">|</mo><mo>≥</mo><mi>𝜀</mi></math><p>que deveria valer para todo <math><mi>𝑛</mi></math>. Daí, <math><mi>𝑓</mi></math> deve ser uniformemente contínua <math><mi>∎</mi></math></p><div style="position: absolute; bottom: 0; right: 0">∎</div></figure></main></body></html>
