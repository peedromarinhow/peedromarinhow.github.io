<!DOCTYPE html><html><head><link rel="stylesheet" href="./main.css"><title>Formalizando os diferenciais</title><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,

  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {

  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,

}

mtable {

}
mtd {

mtable.multiline-equation mtd {

  math-shift: inherit;

}

}

mfrac {

}

mover[accent="true" i] > :first-child {

}

}
